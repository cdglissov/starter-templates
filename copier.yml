_min_copier_version: "9.15"
_templates_suffix: .jinja
_subdirectory: "{{ scaffold_type }}"

scaffold_type:
  type: str
  help: Template variant to use.
  when: false
  choices:
    - python-project-template
  default: "python-project-template"

project_name:
  type: str
  default: "my-project"
  validator: >-
    {% if not (project_name | trim) %}
    Project name cannot be empty.
    {% elif project_name | regex_search('[0-9]') %}
    Project name cannot contain numbers.
    {% endif %}

package_name:
  type: str
  help: Importable package name.
  when: false
  default: "{{ project_name|replace('-', '_') }}"

project_description:
  type: str
  help: Short project description.

author_name:
  type: str
  help: Author name.
  default: "cdglissov"
  validator: >-
    {% if not (author_name | trim) %}
    Author name cannot be empty.
    {% endif %}

python_version:
  type: str
  help: Minimum Python version.
  choices: ["3.10", "3.11", "3.12", "3.13", "3.14"]
  default: "3.12"
  when: "{{ scaffold_type == 'python-project-template' }}"
  validator: >-
    {% if not (python_version | trim) %}
    Python version cannot be empty.
    {% endif %}

copyright_year:
  type: int
  help: Copyright year used in the generated license.
  default: 2026

host_os:
  type: str
  help: Operating system name.
  default: "linux/wsl"
  choices: ["linux/wsl", "windows"]
  validator: >-
    {% if not (host_os | trim) %}
    OS name cannot be empty.
    {% endif %}

harness:
  type: str
  help: Harness environment.
  default: "codex"
  choices: ["codex", "copilot", "claude"]
  validator: >-
    {% if not (harness | trim) %}
    Harness cannot be empty.
    {% endif %}
